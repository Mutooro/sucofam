worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    access_log    off;
    error_log     /dev/stderr warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;

    gzip on;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    server {
        listen       8080;
        server_name  localhost;

        root   /usr/share/nginx/html;
        index  index.html;

        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-src https://www.google.com https://maps.gstatic.com https://maps.google.com;" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # vite-ssg emits about.html, contact.html, ... while the app routes are clean
        # paths. Normalise before any location runs, so a /about.html request can never
        # hydrate against the catch-all route and render the 404 view.
        rewrite ^/+index\.html$ / permanent;
        rewrite ^/+([^.]+)\.html$ /$1 permanent;

        # The canonicals emitted by usePageSeo are slash-free (/about), so the trailing-slash
        # spelling must redirect rather than fall through to the /index.html shell and serve the
        # homepage under a different URL. Non-greedy capture keeps /about// collapsing in one hop.
        rewrite ^/(.+?)/+$ /$1 permanent;

        # Hashed build output is immutable, so it is served directly and never treated
        # as a clean-path page.
        location ^~ /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-src https://www.google.com https://maps.gstatic.com https://maps.google.com;" always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }

        location / {
            # clean path -> pre-rendered file -> SPA fallback
            try_files $uri $uri/ $uri.html /index.html;
        }

        location ~* /[^/]+\.(?:ico|css|js|mjs|gif|jpe?g|png|webp|avif|svg|woff2?|ttf|eot|map)$ {
            expires 1y;
            access_log off;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-src https://www.google.com https://maps.gstatic.com https://maps.google.com;" always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }
    }
}
